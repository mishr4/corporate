<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO & Discord Preview -->
    <title>Cirya CMS | Image & Story Distribution</title>
    <meta name="description" content="Official department for serving high-performance images and digital stories through the Cirya CMS.">
    <meta property="og:title" content="Cirya CMS Services">
    <meta property="og:description" content="Serving high-speed images and stories through our specialized CMS department.">
    <meta property="og:image" content="https://i.postimg.cc/KzYCJ584/Slide-16-9-69-(2).png">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/KzYCJ584/Slide-16-9-69-(2).png">

    <!-- Tailwind CSS for Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            margin: 0;
            padding: 0;
        }
        .metallic-text {
            background: linear-gradient(135deg, #ffffff 0%, #a1a1a1 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="antialiased min-h-screen">

    <!-- Header / Nav -->
    <nav class="max-w-7xl mx-auto px-6 py-8 flex justify-between items-center">
        <div class="text-2xl font-black tracking-tighter metallic-text">CIRYA CMS</div>
        <div class="space-x-6 text-sm font-medium text-gray-400">
            <a href="#" class="hover:text-white transition">Network</a>
            <a href="#" class="hover:text-white transition">Assets</a>
            <a href="#" class="hover:text-white transition">Status</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-6 py-20 text-center">
        <h1 class="text-6xl md:text-8xl font-bold mb-8 metallic-text">
            CMS Services
        </h1>
        <p class="text-xl text-gray-400 mb-12 max-w-2xl mx-auto leading-relaxed">
            Powering the next generation of digital media. We specialize in the high-speed distribution of images and stories across the Cirya ecosystem.
        </p>

        <!-- Stats Section -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16">
            <div class="glass-panel p-8 rounded-2xl">
                <div class="text-4xl font-bold mb-1">2.4M</div>
                <div class="text-xs uppercase tracking-widest text-gray-500">Images Served</div>
            </div>
            <div class="glass-panel p-8 rounded-2xl">
                <div class="text-4xl font-bold mb-1">15ms</div>
                <div class="text-xs uppercase tracking-widest text-gray-500">Latency</div>
            </div>
            <div class="glass-panel p-8 rounded-2xl">
                <div class="text-4xl font-bold mb-1">Online</div>
                <div class="text-xs uppercase tracking-widest text-gray-500">System Status</div>
            </div>
        </div>
    </main>

</body>
</html>
