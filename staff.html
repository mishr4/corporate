<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRYA | Staff Authentication</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // CLIENT INITIALIZATION
        const SUPABASE_URL = 'https://onqhdxzmsvmelmdohcxv.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_tQCI0V0US56Iu70ETzN1UQ_GvhY-LKz';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function signInWithGoogle() {
            try {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { 
                        // MATCHES YOUR DASHBOARD CONFIG
                        redirectTo: 'https://corporate.cirya.co/staff',
                        queryParams: { 
                            hd: 'cirya.co', 
                            prompt: 'select_account' 
                        }
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert("Terminal Error: " + err.message);
            }
        }

        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            const authContainer = document.getElementById('auth-container');
            const cmsContainer = document.getElementById('cms-container');

            if (user) {
                if (user.email.endsWith('@cirya.co')) {
                    authContainer.classList.add('hidden');
                    cmsContainer.classList.remove('hidden');
                    document.getElementById('user-email').innerText = user.email;
                } else {
                    document.getElementById('error-msg').innerText = "ACCESS DENIED: @CIRYA.CO REQUIRED.";
                    await supabase.auth.signOut();
                }
            }
        }

        window.onload = checkUser;
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-white text-black antialiased flex flex-col min-h-screen">

    <div id="auth-container" class="flex-grow flex items-center justify-center px-6">
        <div class="max-w-md w-full border-t-[12px] border-black pt-16">
            <h1 class="text-7xl font-extrabold uppercase leading-[0.85] mb-6 tracking-tighter">Staff<br>Access.</h1>
            <p class="text-[10px] font-black text-gray-400 uppercase tracking-[0.4em] mb-12">Cirya Media Network Management</p>
            
            <button onclick="signInWithGoogle()" class="w-full bg-black text-white py-6 text-[11px] font-black uppercase tracking-widest hover:bg-[#3b28cc] transition flex items-center justify-center gap-4">
                Continue with SSO
            </button>
            <p id="error-msg" class="text-[10px] font-bold text-red-600 mt-10 uppercase tracking-widest text-center"></p>
        </div>
    </div>

    <div id="cms-container" class="hidden px-10 py-24 max-w-screen-2xl mx-auto w-full">
        <header class="flex justify-between items-end border-b-4 border-black pb-10 mb-16">
            <div>
                <p class="text-[11px] font-black text-[#3b28cc] uppercase tracking-widest mb-3">Operator: <span id="user-email" class="text-black"></span></p>
                <h2 class="text-8xl font-extrabold uppercase tracking-tighter">Terminal.</h2>
            </div>
            <button onclick="supabase.auth.signOut().then(() => window.location.reload())" class="text-[10px] font-black uppercase tracking-widest border-2 border-black px-10 py-4">Terminate</button>
        </header>

        <section class="bg-gray-50 p-12 max-w-4xl">
            <h3 class="text-xs font-black uppercase tracking-widest mb-8">Dispatch Center</h3>
            <input type="text" placeholder="BULLETIN HEADER" class="w-full bg-transparent border-b-2 border-black py-6 outline-none font-bold uppercase text-4xl">
            <textarea placeholder="INPUT DATA..." rows="4" class="w-full bg-transparent border-b border-gray-200 py-6 outline-none mt-4"></textarea>
            <button class="mt-10 bg-black text-white px-12 py-5 text-[11px] font-black uppercase tracking-widest">Push to Network</button>
        </section>
    </div>
</body>
</html>
